on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        default: beta
        options:
          - stable
          - beta
          - alpha
      version:
        description: "Version (required for stable/beta, ignored for alpha)"
        default: ""
        required: false
        type: string
      release:
        type: boolean
        default: false
        description: "Release"
      draft:
        type: boolean
        default: true
        description: "Draft"

# The release step creates the GitHub release and uploads assets; the
# repository's default token is read-only.
permissions:
  contents: write

jobs:
  next-version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.nv.outputs.channel }}
      version: ${{ steps.nv.outputs.version }}
      tag: ${{ steps.nv.outputs.tag }}
      name: ${{ steps.nv.outputs.name }}
      release: ${{ steps.nv.outputs.release }}
      draft: ${{ steps.nv.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: nv
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -u
          # Alpha is the only auto-versioned channel; stable and beta take
          # the version from the dispatch input.
          if [ "$CHANNEL" = alpha ]; then
            git ls-remote --tags origin > tags.txt
            version=$(python .github/scripts/next-version.py < tags.txt)
            tag="v$version-alpha"
            name="OpenUtau Xen ${version%.*} Alpha"
          else
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'; then
              echo "::error::version must be X.Y.Z for the $CHANNEL channel (got '$VERSION')"
              exit 1
            fi
            version="$VERSION"
            # OpenUtau Xen tags are v-prefixed (vX.Y.Z), matching the annotated
            # version tags on main.
            if [ "$CHANNEL" = beta ]; then
              tag="v$version-beta"
              name="OpenUtau Xen $version Beta"
            else
              tag="v$version"
              name="OpenUtau Xen $version"
            fi
          fi
          {
            echo "channel=$CHANNEL"
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$name"
            echo "release=$RELEASE"
            echo "draft=$DRAFT"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: next-version
    runs-on: ${{ matrix.arch.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: win-x64, rid: win-x64, arch: x64, os: win, runs-on: windows-latest }
          - { name: win-arm64, rid: win-arm64, arch: arm64, os: win, runs-on: windows-latest }
          - { name: osx-arm64, rid: osx-arm64, arch: arm64, os: osx, runs-on: macos-latest }
          - { name: linux-x64, rid: linux-x64, arch: x64, os: linux, runs-on: ubuntu-latest, linuxarch: x86_64}
          - { name: linux-arm64, rid: linux-arm64, arch: arm64, os: linux, runs-on: ubuntu-latest, linuxarch: aarch64}

    steps:
      # Setup
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install NSIS via Chocolatey
        run: choco install nsis --version=3.11 --no-progress
        if: ${{ matrix.arch.os == 'win' }}
      - uses: justalemon/VersionPatcher@v0.7.1
        with:
          version: ${{ needs.next-version.outputs.version }}
          csproj-files: "OpenUtau/*.csproj"

      # Test
      - name: Test
        run: dotnet test OpenUtau.Test

      # Build
      - name: Restore
        run: dotnet restore OpenUtau -r ${{ matrix.arch.rid }}

      - name: Build (Windows and Linux)
        run: dotnet publish OpenUtau -c Release -r ${{ matrix.arch.rid }} --self-contained true -o bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os != 'osx' }}

      - name: Build (MacOS)
        run: dotnet msbuild OpenUtau -t:BundleApp -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.arch.rid }} -p:UseAppHost=true -p:SelfContained=true -p:OutputPath=../bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os == 'osx' }}

      - name: Add Liquid Glass icon (macOS)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          chmod +x .github/scripts/add-liquid-glass-icon.sh
          app="$(ls -d bin/${{ matrix.arch.name }}/publish/*.app | head -n 1)"
          .github/scripts/add-liquid-glass-icon.sh \
            "$app" \
            OpenUtau/Assets/OpenUtau.icon \
            OpenUtau
        if: ${{ matrix.arch.os == 'osx' }}

      - name: Write release channel info
        run: "@{Channel='${{ needs.next-version.outputs.channel }}'} | ConvertTo-Json > bin/${{ matrix.arch.name }}/prefs-default.json"
        shell: pwsh

      # Create Zip
      - name: DirectML
        shell: cmd
        run: |
          curl -L https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -o Microsoft.AI.DirectML.nupkg
          mkdir Microsoft.AI.DirectML
          tar -xf Microsoft.AI.DirectML.nupkg -C Microsoft.AI.DirectML
          copy /y Microsoft.AI.DirectML\bin\${{ matrix.arch.arch }}-${{ matrix.arch.os }}\DirectML.dll bin\${{ matrix.arch.name }}\
        if: ${{ matrix.arch.os == 'win' }}

      - name: Set executable permission
        run: chmod +x bin/${{ matrix.arch.name }}/OpenUtau-Xen
        if: ${{ matrix.arch.os == 'linux' }}

      - name: Zip
        run: |
          cd bin/${{ matrix.arch.name }}
          7z a ../../OpenUtau-Xen-${{ matrix.arch.name }}.zip *
        if: ${{ matrix.arch.os == 'win' }}

      - name: Tar.gz
        run: |
          cd bin/${{ matrix.arch.name }}
          tar -czf ../../OpenUtau-Xen-${{ matrix.arch.name }}.tar.gz *
        if: ${{ matrix.arch.os == 'linux' }}

      # Create Installer
      - name: Get VC Redist
        run: |
          curl https://aka.ms/vs/17/release/vc_redist.${{ matrix.arch.arch }}.exe -o vc_redist.${{ matrix.arch.arch }}.exe
        if: ${{ matrix.arch.os == 'win' }}

      - name: Create Installer
        uses: joncloud/makensis-action@v4.1
        with:
          script-file: OpenUtau.nsi
          arguments: "-DPRODUCT_VERSION=${{ needs.next-version.outputs.version }} -DARCH=${{ matrix.arch.arch }}"
        if: ${{ matrix.arch.os == 'win' }}

      # Create Dmg
      - name: Create Dmg
        run: |
          npm install -g create-dmg
          app="$(ls -d bin/${{ matrix.arch.name }}/publish/*.app | head -n 1)"
          cp OpenUtau/Assets/OpenUtau.icns "$app/Contents/Resources/"
          create-dmg "$app" || true
          mv *.dmg OpenUtau-Xen-${{ matrix.arch.name }}.dmg
          codesign -fvs - OpenUtau-Xen-${{ matrix.arch.name }}.dmg
        if: ${{ matrix.arch.os == 'osx' }}

      # Create Appimage
      - name: Install LinuxDeploy
        uses: AnimMouse/setup-appimage@v1
        with:
          name: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        if: ${{ matrix.arch.os == 'linux' }}

      - name: Create appimage
        run: |
          cp OpenUtau/Assets/OpenUtau.desktop bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}/.DirIcon
          cp OpenUtau/Assets/AppRun bin/${{ matrix.arch.name }}
          chmod 755 bin/${{ matrix.arch.name }}/AppRun
          ARCH=${{ matrix.arch.linuxarch }} linuxdeploy --appdir bin/${{ matrix.arch.name }} --output appimage
          mv *-${{ matrix.arch.linuxarch }}.AppImage OpenUtau-Xen-${{ matrix.arch.name }}.AppImage
        if: ${{ matrix.arch.os == 'linux' }}

      # Upload Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Xen-${{ matrix.arch.name }}.tar.gz
          path: OpenUtau-Xen-${{ matrix.arch.name }}.tar.gz
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'linux' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Xen-${{ matrix.arch.name }}.zip
          path: OpenUtau-Xen-${{ matrix.arch.name }}.zip
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'win' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Xen-${{ matrix.arch.name }}.exe
          path: OpenUtau-Xen-${{ matrix.arch.name }}.exe
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'win' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Xen-${{ matrix.arch.name }}.AppImage
          path: OpenUtau-Xen-${{ matrix.arch.name }}.AppImage
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'linux' }}

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-Xen-${{ matrix.arch.name }}.dmg
          path: OpenUtau-Xen-${{ matrix.arch.name }}.dmg
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'osx' }}

      # Appcast
      - name: Appcast Windows
        shell: cmd
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=windows -r=${{ matrix.arch.name }} -f=OpenUtau-Xen-${{ matrix.arch.name }}.zip
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=windows -r=${{ matrix.arch.name }}-installer -f=OpenUtau-Xen-${{ matrix.arch.name }}.exe
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'win' }}

      - name: Appcast MacOS
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=macos -r=${{ matrix.arch.name }} -f=OpenUtau-Xen-${{ matrix.arch.name }}.dmg
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'osx' }}

      - name: Appcast Linux
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=linux -r=${{ matrix.arch.name }} -f=OpenUtau-Xen-${{ matrix.arch.name }}.tar.gz
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'linux' }}

      # Release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.next-version.outputs.tag }}
          name: ${{ needs.next-version.outputs.name }}
          prerelease: ${{ needs.next-version.outputs.channel != 'stable' }}
          draft: ${{ needs.next-version.outputs.draft }}
          files: |
            appcast.${{ matrix.arch.name }}*.xml
            OpenUtau-Xen-${{ matrix.arch.name }}.*
          body: |
            OpenUtau Xen is a development build of OpenUtau for microtonal and multi-tuning singing synthesis. See the [README](https://github.com/palf-gh/OpenUtau-Xen#readme) and the [production record](https://github.com/palf-gh/OpenUtau-Xen/blob/main/docs/microtonal/PRODUCTION.md) for what this version contains and what is still unverified.

            General OpenUtau usage: [Getting Started](https://github.com/stakira/OpenUtau/wiki/Getting-Started) and [FAQ](https://github.com/stakira/OpenUtau/wiki/FAQ). Report OpenUtau Xen issues [in this repository](https://github.com/palf-gh/OpenUtau-Xen/issues), not upstream.

            ## macOS says "This app is damaged"
            Open a terminal and run `xattr -rc "/Applications/OpenUtau Xen.app"`. Try opening OpenUtau Xen again.
        if: ${{ needs.next-version.outputs.release == 'true' }}
